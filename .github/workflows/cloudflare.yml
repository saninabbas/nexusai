name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-trader-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ca091d9551571d3a928a258b0c95dd4c
  D1_DATABASE_NAME: nexus-trader-licenses

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Ensure D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response="$(curl -fsS             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"

          database_id="$(DB_NAME="$D1_DATABASE_NAME" node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            if (!payload.success) process.exit(1);
            const database = (payload.result || []).find((item) => item.name === process.env.DB_NAME);
            if (database) process.stdout.write(database.uuid);
          ' <<< "$response")"

          if [ -z "$database_id" ]; then
            response="$(curl -fsS               --request POST               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               --header "Content-Type: application/json"               --data "{\"name\":\"$D1_DATABASE_NAME\"}"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"

            database_id="$(node -e '
              const fs = require("fs");
              const payload = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!payload.success || !payload.result?.uuid) process.exit(1);
              process.stdout.write(payload.result.uuid);
            ' <<< "$response")"
          fi

          if [ -z "$database_id" ]; then
            echo "::error::Could not resolve or create the D1 database."
            exit 1
          fi

          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Build application
        run: npm run build

      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy --config dist/server/wrangler.json

      - name: Verify production health
        env:
          HEALTH_URL: https://nexus-ai-trading-bot.local-sass.workers.dev/api/health
        run: |
          response="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$HEALTH_URL")"
          HEALTH_RESPONSE="$response" node -e '
            const payload = JSON.parse(process.env.HEALTH_RESPONSE);
            if (!payload.ok || payload.version !== "3.1.0" || payload.testnetOnly !== true) {
              console.error("Unexpected production health response:", payload);
              process.exit(1);
            }
            console.log(`Verified ${payload.product} ${payload.version} production health.`);
          '
